  <script>
    $(document).ready(function () {
      assignMetaValue();
      $("meta[name='google-signin-client_id']").attr("content", metaValue);
      // sessionName = localStorage.getItem("email");
      // //sessionName = sessionStorage.getItem('name');
      // // sessionStorage.setItem('name','sravan')
      // console.log("Session name - " + sessionName);
      getLocalSessionData();
      if (sessionName == null) {
        window.location.href = 'index.html';
        return false;
      } else {
        local_emp_profile_data = localStorage.getItem("emp_profile_id_data");
        var sow_id = localStorage.getItem("employee_id_data");
        // console.log("next page - ", local_emp_profile_data);
        var semployee_id_data = [];
        employee_id_data = $.parseJSON('[' + local_emp_profile_data + ']');
        if (employee_id_data[0].END_DATE == "0000-00-00") {
          endDate = "";
        } else {
          endDate = convert(employee_id_data[0].END_DATE);
        }
        console.log("employee_id_data - ", employee_id_data);
        $("#employee_id").val(employee_id_data[0].EMPLOYEE_ID);
        $("#name").val(employee_id_data[0].EMPLOYEE_NAME);
        $("#designation").val(employee_id_data[0].JOB_ROLE_ID);
        $("#emp_email_id").val(employee_id_data[0].EMAIL_ID);
        $("#join_date").val(convert(employee_id_data[0].JOIN_DATE));
        $("#end_date").val(endDate);
        $("#project_alloc_start_date").val(convert(employee_id_data[0].PROJECT_ALLOCATION_START_DATE));
        $("#project_alloc_end_date").val(convert(employee_id_data[0].PROJECT_ALLOCATION_END_DATE));
        $("#reporting_manager").val(employee_id_data[0].REPORTING_MANAGER);
        $("#cus_name").val(employee_id_data[0].CUSTOMER_NAME);
        $("#bill_status").val(employee_id_data[0].BILLING_STATUS);
        $("#location").val(employee_id_data[0].LOCATION);
        $("#function").val(employee_id_data[0].FUNCTION);
        $("#status").val(employee_id_data[0].STATUS);
        let emp_skills = employee_id_data[0].SKILL_DATA;
        let emp_skill_data = "";
        // let emp_skill_hide_data = "";
        $.each(emp_skills, function (value, skills) {
          // mang_name_options_sow += '<option value="' + mangName.REPORTING_MANAGER_ID + '">' + mangName.REPORTING_MANAGER_NAME + '</option>';
          emp_skill_data += `<button class="skill_data">${skills.SKILL} - ${skills.LEVEL}</button>`
          // emp_skill_hide_data += `${skills.SKILL} ${skills.LEVEL}, `
        });
        if (emp_skill_data == "") {
          emp_skill_data = `<button class="skill_data">No skills available to show</button><br><br>`
        }
        $("#key_skill").html(emp_skill_data);
        $(".new-sub-menu").hover(function () {
          $('.sub-menu').css('display', '')
          // }, function () {
          //    alert("hi out");
        });
      }
    });
    $('input[name=proj_alloc_end_date]').change(function() { console.log("testt") });

    $('#join_date').datepicker({
      format: 'mm-dd-yy',
      uiLibrary: 'bootstrap'

    $('#end_date').datepicker({
      format: 'mm-dd-yy',
      uiLibrary: 'bootstrap'
    });
    $('#project_alloc_start_date').datepicker({

      uiLibrary: 'bootstrap'
    });
    $('#project_alloc_end_date').datepicker({
      format: 'mm-dd-yy',
      uiLibrary: 'bootstrap'
    });


    function convert(str) {
      var date = new Date(str),
        mnth = ("0" + (date.getMonth() + 1)).slice(-2),
        day = ("0" + date.getDate()).slice(-2);
      return [mnth, day, date.getFullYear().toString().substr(2, 2)].join("-");
    }
