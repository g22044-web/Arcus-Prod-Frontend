<!DOCTYPE html>
<html lang="en">

<head>
  <title>Factspan - ARCUS - Employee Details</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv='cache-control' content='no-cache'>
  <meta http-equiv='expires' content='0'>
  <meta http-equiv='pragma' content='no-cache'>
  <link rel="stylesheet" href="css/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="js/jquery/3.5.1/jquery.min.js"></script>
  <link rel="stylesheet" href="css/dataTables/1.10.25/css/jquery.dataTables.min.css">
  </style>
  <script type="text/javascript" src="js/dataTables/1.10.25/js/jquery.dataTables.min.js"></script>
  <script src="js/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script src="js/gijgo/1.9.13/js/gijgo.min.js" type="text/javascript"></script>
  <link href="css/gijgo/1.9.13/css/gijgo.min.css" rel="stylesheet" type="text/css" />
  <link href="css/toastr/2.0.1/css/toastr.css" rel="stylesheet" />
  <script src="js/toastr/2.0.1/js/toastr.js"></script>
  <script src="js/fontawesome/fontawesome.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="css/custom.css" />
  <link rel="stylesheet" href="css/busyLoading.css" />
  <script src="js/empProfile.js"></script>
  <script src="js/common.js"></script>
  <link rel="icon" href="images\factspan.png" type="image/png" sizes="16x16">
  <script>
    $(function () {
      $('#header').load('header.html');
    })
  </script>
</head>
<style>
  #app-name {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #menu {
    text-align: center;
    box-shadow: 0px 0px 10px #c4c0c0;
    border-radius: 15px;
    
    align-items: center;
    justify-content: center;
    width: 85%;
 
    background-color: #fff;
    padding: 40px 60px 60px 60px;
  }

  #dash-title {
    text-align: left;
    font-size: 20px;
    font-weight: 600;
  }

  .center-menu {
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 25px;
    height: 120px;
    color: #fff;
    font-size: 20px;
    box-shadow: 0px 0px 10px #571b1b;
    font-weight: 600;
  }

  .menu-header {
    position: absolute;
    left: 0;
    right: 0;
    margin-left: auto;
    margin-right: auto;
  }




  @media screen and (max-height: 450px) {
    .sidenav {
      padding-top: 15px;
    }

    .sidenav a {
      font-size: 12px;
    }
  }

  #emp_table thead>tr>th {
    background-color: #fae9e9;
  }

  #emp_table td,
  #customers th {
    border: 0.5px solid #ddd;
    padding: 8px;
    text-align: center;
  }

  
  .navbar-default .navbar-nav>li>a {
    
    font-weight: 500;
  }

  
  #profile {
    background-color: cadetblue;
    border-radius: 124px;
    font-size: 30px;
    margin-left: 15px;
  }



  #profile_div a:hover {
    color: #eff4f8;
  }

  .navbar-brand {
    padding: 0px 15px;
  }

  #emp_name {
    margin-top: 5px;
    margin-left: 10px;
  }
  .innotice{
    margin-left: 10px;
  padding: 5px;

  color: #ffffff;
  font-weight: 400;
  border-radius: 5px;
    background-color: #ed7d2dff !important;
  }
  .activeclass{
    margin-left: 10px;
  padding: 5px;

  color: #ffffff;
  font-weight: 400;
  border-radius: 5px;
    background-color: #0e9039ff !important;
  }
</style>

<body>
  <div class="loader">
    <div class="loader-wheel"></div>
    <div class="loader-text"></div>
  </div>

  <div class="show_page" style="display: none;">
    <div id="header"></div>
    <div class="wrapper_outer">
      <div class="container-fluid">
        <div class="detail_box">
          <div class="employee_form" id="emp_form">
            <div class="detail_top_bar">
             
              <button class="btn btn-info pull-right" id="employee" style="margin: 10px;">Back</button>
            </div>
            <div class="col-sm-12 main_div">
              <div class="col-sm-6 bg_box">
                <div class="col-sm-8">
                  <center><span id="snapshot_details">SNAPSHOT</span></center>
                </div>
                <div class="col-sm-4">
                  <span id="emp_dept">Delivery</span>
                </div>
                <br>
                <div>
                  
                  <img src="images\profile_image.png" alt="Factspan Logo" class="responsive" id="emp_profile_img"
                    width="100px" height="115px">
               
                  <div class="emp_div div_padding"><span id="emp_name"></span></div>
                  <div class="float_right div_padding" disabled><span id="emp_resume" onclick="getResume()">Resume</span></div>
                  <div class="div_padding"><span id="emp_mail"></span></div>
                  <div class="div_padding"><span id="emp_desg">Designation</span></div>
                  <div class="div_padding"><span id="emp_active"></span> <span id="emp_loc"></span></div>
                  <div class="col-sm-4 potential_class">
                    <label><b>Potential Score</b></label>
                    <input type="text" class="form-control" id="emp_potential_score" name="emp_potential_score">
                  </div>
                  <div class="col-sm-4">
                    <label><b>Reporting Manager</b></label>
                    <input type="text" class="form-control" id="emp_reporting_manager" name="emp_reporting_manager">
                  </div>
                  <div class="col-sm-4">
                    <label><b>Next Available Date</b></label>
                    <input type="text" class="form-control" id="emp_next_avail_date" name="emp_next_avail_date">
                  </div>
                  <div class="col-sm-4">
                    <label><b>Attrition Score</b></label>
                    <input type="text" class="form-control" id="emp_attrition_score" name="emp_attrition_score">
                  </div>
                </div>
              </div>
              <div class="col-sm-2 bg_box">
                <div class="exp_div">Experience</div>
                <div class="emp_total" onclick="showAllExp()"><span id="emp_total_exp"></span> <i
                    class="fa fa-chevron-down" aria-hidden="true"></i></div>
                <br>
                <div class="exp_div_submenu" style="display: none;">
                  <span><b>In Factspan</b></span><br>
                  <div class="emp_factspan" onclick="editYtdBilling()"><span id="emp_factspan_exp"></span></div>
                  <span><b>Outside Factspan</b></span>
                  <!-- <br> -->
                  <div class="emp_factspan"><span id="emp_outside_exp"></span></div>
                </div>
              </div>
              <div class="col-sm-4 bg_box">
                <div class="skill_div">
                  <span id="skill_header">Skills</span>
                  <div class="skill_edit" onclick="editSkillPersona()"><i class="fa fa-pencil-square-o"
                      aria-hidden="true"></i></div>
                </div>
                <div class="col-sm-12 text-center skill_sub_div">
                  <div class="col-sm-6 remove_padding">
                    <label><b>Persona</b></label>
                    <div class="persona_data_div">
                      
                    </div>
                  </div>
                  <div class="col-sm-6 remove_padding">
                    <label><b>Skills Level</b></label>
                    <div class="skills_data_div">
                     
                    </div>
                  </div>
                </div>
              </div>
            </div>
            <div class="col-sm-12 main_div">
              <div class="col-sm-7 bg_box">
                <div class="ytd_div">
                  <span>YTD Billing %</span>
                  
                </div>
                <br>
                <div class="ytd_per_div" onclick="showYTDData()"><span id="ytd_per_data"><span id="ytd_mnth_data">90%
                    </span> <i class="fa fa-chevron-down" aria-hidden="true"></i></span></div>
                <br>
                <div class="ytd_month_data col-sm-12" style="display: none;">
                  <div class="ytd_month_header">
                    
                  </div>
                  <br>
                  <div class="ytd_month_body">
                   
                  </div>
                </div>

              </div>
              <div class="col-sm-5 bg_box">
                <div class="col-sm-12 training_div">
                  <span id="snapshot_details">TRAINING & ASPIRATION</span>
                  <div class="training_edit" id="trainingCertificate"><i class="fa fa-pencil-square-o"
                      aria-hidden="true"></i></div>
                </div>
                <div class="col-sm-12 skills_div">
                  <label><b>Aspiration</b></label>
                  <input type="text" class="form-control" id="emp_aspiration" name="emp_aspiration">
                </div>
                <div class="col-sm-6 skills_div">
                  <label><b>CERTIFICATIONS</b></label>
                  <input type="text" class="form-control" id="emp_certification" name="emp_certification">
                </div>
                <div class="col-sm-6 skills_div">
                  <label><b>COMPLETED TRAININGS</b></label>
                  <input type="text" class="form-control" id="emp_comp_training" name="emp_comp_training">
                </div>
                <div class="col-sm-6 skills_div">
                  <label><b>Skills They Can Teach</b></label>
                  <input type="text" class="form-control" id="emp_skill_to_teach" name="emp_skill_to_teach">
                </div>
                <div class="col-sm-6 skills_div">
                  <label><b>Next Skills To Learn</b></label>
                  <input type="text" class="form-control" id="emp_next_skill_learn" name="emp_next_skill_learn">
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    
    

  </script>
  

</body>

</html>
