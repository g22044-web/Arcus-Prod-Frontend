  <style>
    #app-name {

    }

    @media screen and (max-height: 450px) {

    #emp_table thead>tr>th {

    #emp_table td,

    }

  
    .navbar-default .navbar-nav>li>a {

    }

   
    #profile {

    }



    #profile_div a:hover {
      color: #eff4f8;
    }

    .navbar-brand {
      padding: 0px 15px;
    }

    .SerialNumberTooltip {
      position: absolute;
      top: 25px;
      left: 0px;
      background-color: #b5abb5 !important;
      border: 1px solid #CCC;
      display: none;
      width: auto !important;
      text-align: left;
      cursor: pointer;
      text-shadow: 1px 1px 2px black, 0 0 10px #38387b, 0 0 5px #454559 !important;
      padding: 2px 4px;
      font-size: 12px;
    }

    ol,
    ul {
      margin-top: 0;
      margin-bottom: 10px;
      padding-inline-start: 0px;
      margin-block-end: 0px;
    }

    .toggle_style {
      margin-top: 50px;
    }

    .orgchart-toolbar {
      min-height: 45px;
      margin: 0 -15px;
      padding: 0px 35px;
      background: #1F3864;
      border-top: 0.5px solid #6d6d6d;
      border-bottom: 6px solid #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      width: calc(100% + 30px);
      box-sizing: border-box;
      clear: both;
    }

    .orgchart-toolbar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex-wrap: wrap;
    }

    .orgchart-toolbar .toggle_style {
      margin-top: 0;
      float: none !important;
    }

    .orgchart-region-toggle {
      position: relative;
      margin: 0;
      flex: 0 0 auto;
    }

    .orgchart-region-toggle input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .orgchart-region-toggle label {
      display: block;
      margin: 0;
      cursor: pointer;
    }

    .orgchart-region-track {
      position: relative;
      display: flex;
      align-items: center;
      width: 125px;
      height: 30px;
      padding: 4px;
      background: #16243e;
      border-radius: 999px;
      overflow: hidden;
    }

    .orgchart-region-track::before {
      content: "";
      position: absolute;
      top: 5px;
      left: 4px;
      width: calc(50% - 4px);
      height: 20px;
      background: #ff7d20;
      border-radius: 999px;
      transition: transform 0.25s ease;
      z-index: 1;
    }

    .orgchart-region-toggle input[type="checkbox"]:checked + label .orgchart-region-track::before {
      transform: translateX(100%);
    }

    .orgchart-region-option {
      position: relative;
      z-index: 2;
      flex: 1 1 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      white-space: nowrap;
      color: #ffffff;
      font-family: "Poppins", "Celias", sans-serif;
      font-size: 12px;
      font-weight: 500;
      line-height: 1;
    }

    .orgchart-legend-separator {
      width: 1px;
      height: 32px;
      background: rgba(255, 255, 255, 0.35);
      flex: 0 0 auto;
    }

    .orgchart-legends {
      display: none !important;
      align-items: center;
      gap: 5px;
      color: #ffffff;
      font-family: "Poppins", "Celias", sans-serif;
      font-size: 10px;
      font-weight: 400;
      flex-wrap: wrap;
    }

    .orgchart-legends.is-active {
      display: flex !important;
    }

    .orgchart-legends > span {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .orgchart-legends .vp_color,
    .orgchart-legends .sd_color,
    .orgchart-legends .sm_color,
    .orgchart-legends .sol_color,
    .orgchart-legends .sa_color,
    .orgchart-legends .am_color,
    .orgchart-legends .a_color,
    .orgchart-legends .scr_color,
    .orgchart-legends .c_color,
    .orgchart-legends .ben_color {
      width: 8px;
      height: 8px;
      border-radius: 999px;
      display: inline-block;
    }

    .orgchart-toolbar-right {
      margin-left: auto;
      display: flex;
      align-items: center;
    }

    .orgchart-back-btn {
      min-width: 60px;
      height: 30px;
      padding: 0 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      color: #ffffff !important;
      border: 1px solid rgba(255, 255, 255, 0.85) !important;
      border-radius: 10px !important;
      box-shadow: none !important;
      font-family: "Poppins", "Celias", sans-serif;
      font-size: 12px;
      font-weight: 400;
    }

    .orgchart-back-btn:hover,
    .orgchart-back-btn:focus,
    .orgchart-back-btn:active {
      color: #ffffff !important;
      background: rgba(255, 255, 255, 0.08) !important;
      outline: none;
    }

    .employee_form {
      height: calc(100vh - 100px);
      overflow-y: visible;
    }

    .orgChart.employee_form {
      display: block !important;
      width: 100% !important;
      min-width: 100% !important;
      max-width: 100% !important;
      padding-top: 16px !important;
      padding-left: 0 !important;
      padding-right: 0 !important;
      box-shadow: none;
      border-radius: 0;
      float: none !important;
      clear: both;
    }

    .detail_box {
      display: block !important;
      width: 100% !important;
    }

    #chart {
      display: block;
      width: 100%;
      overflow-x: auto;
      height: calc(100vh - 170px);
    }
    .sowteam_radio_filter{
  display: flex;
  
    justify-content: space-around;
    align-items: center;
    background-color: #cecece;
    width: 200px;
    height: 25px;
    border-radius: 9999px;
    
    box-shadow: inset 0.5px 0.5px 2px 0 rgb(0 0 0 / 15%);
   
}
.sowteam_radio_filter > input[type="radio"]
 {
  appearance: none;
  display: none;
}
.sowteam_radio_filter > input[type="radio"]:checked + label
{
  background-color: #1e90ff;
  color: #f1f3f5;
  font-weight: 900;
  transition: 0.3s;
}
.sowteam_radio_filter>label {
    font-family: "Open Sans", sans-serif;
    font-size: 12px;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: inherit;
    width: 80px;
    height: 20px;
    text-align: center;
    border-radius: 9999px;
    overflow: hidden;
    transition: linear 0.3s;
    color: #6e6e6edd;
    margin-bottom: 0px;
    
}

    .footer {
      color: rgb(11, 44, 117);
      text-align: initial;
      margin-left: 1%;
    }

    .orgchart-footer-meta {
      margin-top: 6px;
      font-size: 12px;
      font-weight: 500;
      color: #31456e;
    }

    @media screen and (max-width: 1100px) {
      .orgchart-toolbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .orgchart-toolbar-right {
        width: 100%;
        justify-content: flex-start;
        margin-left: 0;
      }
    }

    @media screen and (max-width: 640px) {
      .orgchart-toolbar {
        padding: 16px;
      }

      .orgchart-toolbar-left {
        width: 100%;
      }

      .orgchart-legend-separator {
        display: none;
      }
    }
  </style>
</head>
