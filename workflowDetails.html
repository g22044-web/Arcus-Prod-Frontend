      const email = localStorage.getItem('email');
      const userRoles = (localStorage.getItem('user-role') || '')
        .split(',')
        .map(function (role) { return role.trim().toLowerCase(); });

      const hasAdminDashboardAccess =
        departmentName === 'Products' ||
        departmentName === 'CEO' ||
        departmentName === 'COE' ||
        jobRole === 'Vice President' ||
        userRoles.includes('admin') ||
        email === 'nitin.pandey@factspan.com' ||
        email === 'nagarajan.v@factspan.com';

      return hasAdminDashboardAccess ? 'adminDashboard.html' : 'home.html';
    }

    $('#dashboard').click(function () {
      window.location.href = getDashboardPageUrl();
      return false;
    });
    $('#dashboardPage').click(function () {
      window.location.href = getDashboardPageUrl();
      return false;
    });
    $('#logout').click(function () {
      localStorage.clear();

      window.location.href = 'index.html';
      return false;
    });


  </script>
