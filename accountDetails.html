  /* ---- Account Reorder Modal ---- */
  :root {
    --color-background-primary: #ffffff;
    --color-background-secondary: #f8f9fa;
    --color-background-success: #e8f5e9;
    --color-background-info: #E6F1FB;
    --border-radius-xl: 12px;
    --border-radius-md: 6px;
    --color-border-primary: #4CA5FF;
    --color-border-secondary: #e0e0e0;
    --color-border-tertiary: #f0f0f0;
    --color-border-info: #185FA5;
    --color-text-primary: #313265;
    --color-text-tertiary: #888888;
    --color-text-success: #2e7d32;
  }
  .overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.4);
    z-index: 9999;
    justify-content: center;
    align-items: center;
    padding: 1.5rem;
  }
  .overlay.show { display: flex !important; }
  
  .overlay .modal {
    background: var(--color-background-primary);
    border-radius: var(--border-radius-xl);
    border: 0.5px solid var(--color-border-secondary);
    width: 100%;
    max-width: 560px;
    display: flex !important;
    flex-direction: column;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
    position: relative !important;
    top: auto !important;
    left: auto !important;
    height: auto !important;
    margin: 0 !important;
  }
  .overlay .mhead {
    padding: 1.1rem 1.25rem 1rem;
    border-bottom: 0.5px solid var(--color-border-tertiary);
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #1F3864;
  }
  .overlay .mhead h2 { font-size: 12px; font-weight: 400; color: var(--color-background-primary); margin: 0; }
  .overlay .mhead span { font-size: 12px; color: var(--color-text-tertiary); cursor: pointer; }
  
  .overlay .sbar { padding: 0.65rem 1.25rem; border-bottom: 0.5px solid var(--color-border-tertiary); position: relative; background-color: #1F3864;}
  .overlay .sbar input {
    width: 100%; padding: 7px 12px 7px 32px; border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md); font-size: 13px; background: #1F3864;
    color: #fff; outline: none;
  }
  .overlay .sbar input:focus { border-color: var(--color-border-primary); background: #1F3864; color }
  .overlay .sbar .ti { position: absolute; left: 24px; top: 50%; transform: translateY(-50%); color: #fff; font-size: 12px; pointer-events: none; }
  
  .overlay .list-wrap {
    padding: 0.5rem 1rem;
    max-height: 50vh;
    overflow-y: auto;
  }
  .overlay .row { display: flex; align-items: center; gap: 15px; padding: 12px 16px; margin: 0; border-bottom: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); transition: background 0.2s; outline: none; }
  .overlay .row:hover { background: var(--color-background-secondary); }
  .overlay .row:focus { outline: 2px solid #fc8c15; outline-offset: -2px; background: var(--color-background-secondary); }
  .overlay .row.drag-over { border-top: 2px solid #fc8c15; background: var(--color-background-secondary); }
  .overlay .row.dragging { opacity: 0.5; }
  .overlay .row .grip { color: var(--color-text-tertiary); font-size: 16px; cursor: grab; flex-shrink: 0; padding: 0 4px; }
  .overlay .row .num { font-size: 11px; color: var(--color-text-tertiary); min-width: 18px; text-align: right; flex-shrink: 0; }
  .overlay .row .name { font-size: 12px; color: var(--color-text-primary); flex: 1; font-weight: 500; }
  .overlay .row .badge { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--color-background-success); color: var(--color-text-success); flex-shrink: 0; }
  
  .overlay .mfoot { padding: 0.9rem 1.25rem; border-top: 0.5px solid var(--color-border-tertiary); display: flex; align-items: center; justify-content: space-between; }
  .overlay .mfoot span { font-size: 12px; color: var(--color-text-tertiary); }
  .overlay .btns { display: flex; gap: 8px; }
  .overlay .btn-custom { 
      background-color: #fff;
      font-size: 10px; 
      color: #fc8c15;
      border: 1px solid #fc8c15;
      font-weight: 500;
      transition: all 0.3s;
      border-radius: 30px;
      padding: 5px 20px;
      cursor: pointer;
  }
  .overlay .btn-custom:hover { 
      background-color: #e07436;
      color: #fff;
  }
  .overlay .btn-save { 
      background-color: #fc8c15;
      color: #fff;
      border-color: #fc8c15;
  }
  .overlay .btn-save:hover { 
      background-color: #e07436; 
      color: #fff; 
  }
  .overlay .saved { color: var(--color-text-success); font-size: 12px; opacity: 0; transition: opacity 0.3s; }
  .overlay .saved.show { opacity: 1; }

              //       break;
              //   }
              // })
              let getUserRole = localStorage.getItem("user-role");
              let useremail = localStorage.getItem("email");
              if (getUserRole.toLocaleLowerCase() == "admin" || useremail.toLocaleLowerCase() == "akhilesh@factspan.com") {
                $('.action_data').show();
                $('#reorderAccountsBtn').show();
              }else {
                $('.action_data').hide();
              }
            } else {

            }
          }
        } else {

        }
