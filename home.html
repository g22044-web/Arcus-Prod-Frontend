/* Keep every home navigation tile and icon visually consistent. */
.home_menu_modules .center-menu {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  width: 80% !important;
  height: 55px;
  min-height: 55px;
  padding: 0 44px;
  border: 1px solid #eeeeee;
  border-radius: 10px;
}

.home_menu_modules .center-menu > img {
  flex: 0 0 42px;
  width: 42px !important;
  height: 42px !important;
  max-width: 42px;
  padding: 7px !important;
  object-fit: contain;
  filter: invert(52%) sepia(98%) saturate(3018%) hue-rotate(347deg) brightness(102%) contrast(101%);
}

.home_menu_modules .center-menu .grid_style {
  flex: 1;
  width: auto;
  padding-left: 28px;
  float: none;
}

  <script>
    $(document).ready(function () {

      assignMetaValue();
      $("meta[name='google-signin-client_id']").attr("content", metaValue);

      getLocalSessionData();
      empName = localStorage.getItem("EmpUserName");
      empId = localStorage.getItem("EmpUserID");
      sessionName = localStorage.getItem("email");
      $("#display_name").html(empName);
      $("#email_id").html(sessionName);
      $("#emp_id").html("#" + empId);
      if (sessionName == null) {
        window.location.href = 'index.html';
        return false;
      } else {
        $(".show_page").css("display", "block");
        $(".menu_div").hide()
        empName = localStorage.getItem("EmpUserName");
        empId = localStorage.getItem("EmpUserID");
        sessionName = localStorage.getItem("email");
        accese_level = localStorage.getItem("ACCESS_LEVEL");
        accessData = localStorage.getItem("Access");
        edit_access = localStorage.getItem("EDIT_ACCESS");
        groupName = localStorage.getItem("GROUP_NAME");
        statusDetails = localStorage.getItem("STATUS");
        getApprovalData();
        checkDashboardPageAccessData();
        let user_each_page_access = $.parseJSON(localStorage.getItem("user-access-details"))

        $.each(user_each_page_access, function (i, userAccess) {
          let access = userAccess.ACCESS_DETAILS;
          let role = localStorage.getItem("user-role");
          let roleList = role.split(",")
          let roleCheck = false;
          $.each(roleList, function (j, roleName) {
            if (!roleCheck) {
              if (roleName == "admin") {
                $(".admin").css("display", "flex")
                roleCheck = true
              } else {
                $(".admin").hide();
              }
            }
          })
        })
      }
    });
