    function employeeDetails() {
      window.location.href = 'employee_profile.html';
      return false;
    }


    $('#exampleModal').on('show.bs.modal', function (event) {
      let button = $(event.relatedTarget) // Button that triggered the modal
      let employee_id = button.data('employee_id');
      let name = button.data('name');
      let designation = button.data('designation');
      let function_name = button.data('function');
      let project_manager = button.data('project_manager');
      let reporting_manager = button.data('reporting_manager');
      let location = button.data('location');
      let join_date = button.data('join_date');
      let end_date = button.data('end_date');
      let flag = button.data('flag');
      let skills = button.data('skills');

      let modal = $(this)
      modal.find('.modal-title').text("Employee Details - " + name)
      modal.find('.modal-body #employee_id').val(employee_id)
      modal.find('.modal-body #name').val(name)
      modal.find('.modal-body #designation').val(designation)
      modal.find('.modal-body #function').val(function_name)
      modal.find('.modal-body #project_manager').val(project_manager)
      modal.find('.modal-body #reporting_manager').val(reporting_manager)
      modal.find('.modal-body #location').val(location)
      modal.find('.modal-body #join_date').val(join_date)
      modal.find('.modal-body #end_date').val(end_date)
      modal.find('.modal-body #flag').val(flag)
      modal.find('.modal-body #skills').val(skills)
    })

  </script>
