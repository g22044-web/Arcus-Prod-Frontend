    }

    /* ===== Figma filter toolbar ===== */
    .detail_top_bar.account-filter-toolbar {
      min-height: 30px;
      margin: 0 -10px 0 -15px;
      padding: 6px 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: nowrap;
      background: #1F3864;
      border-top: 1px solid #777675;
      overflow-x: auto;
    }

    .account-toolbar-left,
    .account-toolbar-right {
      display: flex;
      align-items: center;
      gap: 18px;
      flex-wrap: nowrap;
      flex-shrink: 0;
    }

    /* All / IND / USCA pill toggle */
    .account-filter-toolbar .emp_radio_filter {
      width: auto;
      min-height: 30px;
      margin: 0;
      padding: 4px;
      gap: 4px;
      justify-content: flex-start;
      background: #16243e;
      border-radius: 999px;
      box-shadow: none;
    }

    .account-filter-toolbar .emp_radio_filter > input[type="radio"] {
      display: none;
    }

    .account-filter-toolbar .emp_radio_filter > label {
      width: auto;
      height: auto;
      margin: 0;
      padding: 4px 16px;
      border-radius: 999px;
      background: transparent;
      color: #ffffff;
      font-size: 12px;
      font-weight: 400;
      line-height: 1;
      cursor: pointer;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .account-filter-toolbar .emp_radio_filter > input[type="radio"]:checked + label {
      background: #ff7d20;
      color: #fff;
      font-weight: 500;
    }

    /* Divider */
    .account-toolbar-divider {
      width: 1px;
      height: 28px;
      background: rgba(255, 255, 255, 0.28);
      flex-shrink: 0;
    }

    /* Legend on the dark bar (round dots, white text) */
    .account-filter-toolbar .legend-container {
      margin: 0;
    }

    .account-filter-toolbar .legend-bg-code {
      font-size: 12px;
      gap: 18px;
      margin: 0;
      color: #fff;
      flex-wrap: nowrap;
    }

    .account-filter-toolbar .legend-item {
      gap: 7px;
      color: #fff;
      font-size: 10px;
    }

    .account-filter-toolbar .legend-item > div:first-child {
      width: 11px;
      height: 11px;
      border-radius: 50%;
    }

    /* Search field */
    .account-search-field {
      height: 30px;
      min-width: 200px;
      margin: 0;
      padding: 0 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 10px;
      color: #fff;
    }

    .account-search-field i {
      font-size: 13px;
      color: #fff;
    }

    #team_toolbar_search {
      display: inline-flex;
      flex: 1;
    }

    /* Hide the original DataTables search wrapper; its input is relocated into
       #team_toolbar_search by teamdata.js, leaving only the stray "Search:" label behind. */
    #emp_table_filter {
      display: none !important;
    }

    #team_toolbar_search input {
      width: 100%;
      border: 0;
      margin: 0;
      background: transparent !important;
      color: #fff;
      font-size: 12px;
      font-weight: 400;
      outline: none;
      box-shadow: none;
    }

    #team_toolbar_search input::placeholder {
      color: rgba(255, 255, 255, 0.9);
    }

    /* Year dropdown (custom-built list so the open panel matches the toolbar theme
       instead of the browser's native <select> popup) */
    .account-filter-toolbar .alloc_year_filter {
      width: auto;
      position: relative;
      right: auto;
      top: auto;
      margin: 0;
      gap: 8px;
      height: 30px;
      padding: 0 12px;
      display: inline-flex;
      align-items: center;
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 10px;
    }

    .account-filter-toolbar .alloc_year_filter label {
      margin: 0;
      color: #fff;
      font-size: 12px;
      font-weight: 400;
      white-space: nowrap;
    }

    .year-dropdown-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 12px;
      font-weight: 400;
      cursor: pointer;
      outline: none;
    }

    .year-dropdown-btn i {
      font-size: 12px;
      transition: transform 0.15s ease;
    }

    .year-dropdown.open .year-dropdown-btn i {
      transform: rotate(180deg);
    }

    .year-dropdown-list {
      display: none;
      position: fixed;
      margin: 0;
      padding: 4px 0;
      list-style: none;
      background: #ffffff;
      border: 1px solid #d7dbe0;
      border-radius: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.18);
      z-index: 3000;
      overflow: hidden;
    }

    .year-dropdown.open .year-dropdown-list {
      display: block;
    }

    .year-dropdown-list li {
      padding: 8px 14px;
      color: #333333;
      font-size: 13px;
      font-weight: 400;
      line-height: 1.3;
      cursor: pointer;
      white-space: nowrap;
    }

    .year-dropdown-list li:hover {
      background: #f2f4f7;
    }

    .year-dropdown-list li.selected {
      background: #1e90ff;
      color: #ffffff;
      font-weight: 600;
    }

    @media (max-width: 1200px) {
      .detail_top_bar.account-filter-toolbar {
        flex-wrap: wrap;
        overflow-x: visible;
        gap: 12px;
      }
      .account-toolbar-left,
      .account-toolbar-right {
        flex-wrap: wrap;
      }
    }

    .fixTableHead {
      overflow-y: auto;
      /* height: 75vh; */
      height: calc(100vh - 120px);
    }
    .employee_detail_inside {
      display: inline-block;
      width: 100%;
      margin-top: 5px;
      padding: 0px;
      box-shadow: 0px 5px 12px -5px #989696;
      min-height: 400px;
    }

  </style>
