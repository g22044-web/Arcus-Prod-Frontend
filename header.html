    // Makes an asynchronous call to get approval data count.
    async function getApprovalDataCount() {
        // Construct user details for the API request.
        let accessDetails = JSON.stringify({
            ACCESS_LEVEL: accese_level,
            Access: accessData,
            EDIT_ACCESS: edit_access,
            EMAIL_ID: sessionName,
            GROUP_NAME: groupName,
            USERNAME: empName,
            USER_ID: empId,
        });

        try {
            // Await the AJAX request to complete.
            const data = await $.ajax({
                url: apiValue.url,
                type: "POST",
                dataType: "json",
                crossDomain: true,
                data: JSON.stringify({
                    query_type: "approval_data",
                    environment: apiValue.environment,
                    user_details: `[${accessDetails}]`,
                }),
            });

            // Calculate the total count from the different workflow types in the response.
            let totalWorkflowCount = 0;
            $.each(data, function (i, workflowData) {
                if (workflowData.DATA && Array.isArray(workflowData.DATA)) {
                    totalWorkflowCount += workflowData.DATA.length;
                }
            });
            console.log("totalWorkflowCount", totalWorkflowCount);
            return totalWorkflowCount; // Return the calculated count.
        } catch (error) {
            console.error("Error fetching approval data: " + JSON.stringify(error));
            return 0; // Return 0 or handle the error as needed.
        }
    }

    // Makes an asynchronous call to get resource allocation conflict count.
    async function getAllocationConflictCount() {
        let apiURL = `${apiValue.url_ip}:5005/resource_conflicts`;
        let empIDTemp = empId;
        let accessType = localStorage.getItem("user-role");
        console.log("accessType", accessType);
        console.log("empIDTemp", empIDTemp);
        if (accessType == "admin") {
            empIDTemp = ""
        }
        try {
            // Await the AJAX request to complete.
            const data = await $.ajax({
                url: apiURL,
                type: "POST",
                dataType: "json",
                crossDomain: true,
                data: JSON.stringify({ user_id: empIDTemp }),
            });

            let resAllocLen = data.count || 0;
            let resAllocShortLen = data.shortage_count || 0;
            console.log("resAllocLen", resAllocLen);
            return resAllocLen + resAllocShortLen; // Return the count from the response.
        } catch (error) {
            console.error("Error fetching allocation conflict data: " + JSON.stringify(error));
            return 0; // Return 0 or handle the error appropriately.
        }
    }
    async function fetchAllCounts() {
        try {
            const [approvalCount, conflictCount] = await Promise.all([
                getApprovalDataCount(),
                getAllocationConflictCount(),
            ]);
            const totalCount = approvalCount + conflictCount;
            console.log(`Total combined count: ${totalCount}`);

            $('#notification-count').text(totalCount);
            if (totalCount > 0) {
                $('#notification-count').show();
                $(".notification-tab").show();
            } else {
                $('#notification-count').hide();
                $(".notification-tab").hide();
            }
        } catch (error) {
            console.error("An error occurred while fetching counts:", error);
            $('#notification-count').hide();
            $(".notification-tab").hide();
        }
    }
