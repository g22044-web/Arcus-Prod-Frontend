            >

            </button>
            <button
              class="btn cancel-btn sow_btn_cus_style acc-font-style"
              type="button"

        </div>

        </div>

            <label for="aad_account_name">
              Account Name <span class="warningMessage">*</span>
            </label>
            <span class="warningMessage" id="accWarningMsg"
              >Account already exists</span
            >
          </div>
          <input
            type="text"
            class="form-control"
            id="aad_account_name"
            placeholder="Account Name"
            name="aad_account_name"
            autocomplete="off"
            onkeyup="checkAccountName()"
          />
        </div>
        <div class="each_acc_block">
          <label for="add_location">
            Location <span class="warningMessage">*</span></label
          >
          <select id="add_location">
            <option value="-1">Select Location</option>
            <option value="India">India</option>
            <option value="US">US</option>
          </select>
        </div>
        <div class="each_acc_block">
          <label for="add_location">
            Buying Center <span class="warningMessage">*</span></label
          >

            <button type="button"

            </button>
          </div> -->
          <input
            type="text"
            class="form-control"
            id="buyingCenter"
            placeholder="Buying Center"
            name="buyingCenter"
            autocomplete="off"
            onkeydown="restrictSpecialCharactersById('buyingCenter')"
          />

    <script type="text/javascript">
      $(document).ready(function () {
        assignMetaValue();
        $("meta[name='google-signin-client_id']").attr("content", metaValue);
        getLocalSessionData();
        if (sessionName == null) {
          window.location.href = "index.html";
          return false;
        } else {
          $("body").css("display", "block");
          getSowViewData();
          createAccount();
          $("#add_contact_factspan").select2({});
          $("#add_contact_account").select2({});
          $("#add_business_head").select2({});
          $("#add_delivery_head").select2({});
          $("#add_location").select2({});
          $("#account_size").select2({});
          $("#payment_term").select2({});
          $("#add_buying_center").select2({});
          $("#add_nps_holder").select2({});

          $(".input-group-addon").hide();
          $("#accWarningMsg").hide();
          $("#add_buying_center").change(function () {
            const selectedOption = $(this).val();
            console.log("selectedOption - ", selectedOption);
            if (selectedOption) {
              showPopup();
            }
          });
          $("#add_nps_holder").change(function () {
            const selectedOption = $(this).val();
            console.log("selectedOption - ", selectedOption);
            if (selectedOption) {
              ShowNpsPopup();
            }
          });

          function showPopup() {
            $("#popup").fadeIn(200);
            $("#overlay").addClass("overlay");
          }

          function ShowNpsPopup() {
            $("#popup_nps").fadeIn(200);
            $("#overlay").addClass("overlay");
          }

          $("#closePopup").click(function () {
            $("#popup").fadeOut(200);
            $("#popup_nps").fadeOut(200);
            $("#overlay").removeClass("overlay");
          });
          $("#closeNPSPopup").click(function () {
            $("#popup_nps").fadeOut(200);
            $("#overlay").removeClass("overlay");
          });
        }

        $(window).resize(resize);
        resize();
        $(".new-sub-menu").hover(function () {
          $(".sub-menu").css("display", "");
        });
      });
      function resize() {
        if ($(window).width() < 514) {
          $("#resp-table").addClass("table-responsive");
        } else {
          $("#resp-table").removeClass("table-responsive");
        }
      }
      let skillOptions = "";

      $("#ms_signed_date").datepicker({
        format: "mm-dd-yy",
        uiLibrary: "bootstrap",
      });

      $("#dashboard").click(function () {
        window.location.href = "home.html";
        return false;
      });
      $("#sow_creation_page").click(function () {
        window.location.href = "sowCreate.html";
        return false;
      });
      $("#logout").click(function () {
        localStorage.clear();
        window.location.href = "index.html";
        return false;
      });
