  <script>
    $(document).ready(function () {
      assignMetaValue();
      $("meta[name='google-signin-client_id']").attr("content", metaValue);
     
      getLocalSessionData();
      if (sessionName == null) {
        window.location.href = 'index.html';
        return false;
      } else {
        $('body').bind('copy paste', function (e) {
          e.preventDefault(); return false;
        });
        getSowViewData();
        $('.green').attr('background-color', '#b1eeb1 !important');
        $('#legal_start_date').datepicker({
          format: 'mm-dd-yy',
          uiLibrary: 'bootstrap'
        });
        $('#legal_end_date').datepicker({
          format: 'mm-dd-yy',
          uiLibrary: 'bootstrap'
        });
        $('#billing_start_date').datepicker({
          format: 'mm-dd-yy',
          uiLibrary: 'bootstrap'
        });
        $('#billing_end_date').datepicker({
          format: 'mm-dd-yy',
          uiLibrary: 'bootstrap'
        });
        $('#actual_start_date').datepicker({
          format: 'mm-dd-yy',
          uiLibrary: 'bootstrap'
        });
        $('#actual_end_date').datepicker({
          format: 'mm-dd-yy',
          uiLibrary: 'bootstrap'
        });

        // $('.filter_dropdown').toggle();
        $('.input-group-addon').hide();
        $(".loader").css("display", "none");
        $(".show_page").css("display", "block");
        
      }
      $(".new-sub-menu").hover(function () {
        $('.sub-menu').css('display', '')
       
      });
    });
    $('#dashboard').click(function () {
      window.location.href = 'home.html';
      return false;
    });
    $('#sow_Res_page').click(function () {
      localStorage.setItem("addRequest", true);
      localStorage.setItem("editRequest", false);
      window.location.href = 'sowCreate.html';
      return false;
    });
    $('#userManual').click(function () {
      
      window.location.href = 'RRESOWUserManual.html';
      return false;
    });
    $('#logout').click(function () {
      localStorage.clear();
      console.log("sessionName - " + sessionName);
      window.location.href = 'index.html';
      return false;
    });
  </script>
