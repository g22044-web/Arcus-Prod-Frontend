<!DOCTYPE html>
<html lang="en">

<head>
  <title>Factspan - ARCUS - Employee Details</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv='cache-control' content='no-cache'>
  <meta http-equiv='expires' content='0'>
  <meta http-equiv='pragma' content='no-cache'>
  <link rel="stylesheet" href="css/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="js/jquery/3.5.1/jquery.min.js"></script>
  <link rel="stylesheet" href="css/dataTables/1.10.25/css/jquery.dataTables.min.css">
  </style>
  <script type="text/javascript" src="js/dataTables/1.10.25/js/jquery.dataTables.min.js"></script>
  <script src="js/bootstrap/3.4.1/js/bootstrap.min.js"></script>
  <script src="js/gijgo/1.9.13/js/gijgo.min.js" type="text/javascript"></script>
  <link href="css/gijgo/1.9.13/css/gijgo.min.css" rel="stylesheet" type="text/css" />

  <script>
    $(function () {
      $('#header').load('header.html');
    })
  </script>
</head>
<style>
  #app-name {
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #menu {
    text-align: center;
    box-shadow: 0px 0px 10px #c4c0c0;
    border-radius: 15px;

    align-items: center;
    justify-content: center;
    width: 85%;

    background-color: #fff;
    padding: 40px 60px 60px 60px;
  }

  #dash-title {
    text-align: left;
    font-size: 20px;
    font-weight: 600;
  }

  .center-menu {
    display: flex;
    justify-content: center;
    align-items: center;
    border-radius: 25px;
    height: 120px;
    color: #fff;
    font-size: 20px;
    box-shadow: 0px 0px 10px #571b1b;
    font-weight: 600;
  }

  .menu-header {
    position: absolute;
    left: 0;
    right: 0;
    margin-left: auto;
    margin-right: auto;
  }




  @media screen and (max-height: 450px) {
    .sidenav {
      padding-top: 15px;
    }

    .sidenav a {
      font-size: 12px;
    }
  }

  #emp_table thead>tr>th {
    background-color: #fae9e9;
  }

  #emp_table td,
  #customers th {
    border: 0.5px solid #ddd;
    padding: 8px;
    text-align: center;
  }


  .navbar-default .navbar-nav>li>a {

    font-weight: 500;
  }


  #profile {
    background-color: cadetblue;
    border-radius: 124px;
    font-size: 30px;
    margin-left: 15px;
  }



  #profile_div a:hover {
    color: #eff4f8;
  }

  .navbar-brand {
    padding: 0px 15px;
  }

  #emp_name {
    margin-top: 5px;
    margin-left: 10px;
  }

  #emp_factspan_prjt_details {
    font-size: 12px;
  }

  #emp_factspan_prjt_details thead {
    background-color: #f2f2f2;
  }

  .table-bordered>tbody>tr>td,
  .table-bordered>tbody>tr>th,
  .table-bordered>tfoot>tr>td,
  .table-bordered>tfoot>tr>th,
  .table-bordered>thead>tr>td,
  .table-bordered>thead>tr>th {
    border: 1px solid #f6f6f6;
  }

  .each_month_block {
    display: flex;
    flex-direction: column;
    gap: 20px;
    padding: 10px;
    width: fit-content;
    /* border-right: 1px solid #BCBCCA; */
  }

  .ytd_block {
    width: 99%;
    padding: 10px 0px;
  }

  .sub_block {
    border: 1px solid #BCBCCA;
    padding: 5px 10px;
    border-radius: 5px;
    font-weight: 500;
    color: #818199;
    font-size: 12px;
  }

  .ytd_month_data {
    display: flex;
    /* gap: 10px; */
    justify-content: space-between;
  }

  .side_bar {
    color: #D9D9D9;
    width: 1px;
    border: 1px solid;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .ytd_div {
    text-align: justify;
  }

  #ytd_per_data {
    font-weight: 500;
    color: #535252;
    padding: 10px 30px;
  }

  #ytd_billing_data {
    margin-top: 20px;
  }

  .resource_ytd_history {
    height: calc(100vh - 380px);
  }

  #emp_factspan_prjt_details tbody>tr>td {
    padding: 10px;
    font-weight: 400;
  }

  #emp_factspan_prjt_details thead>tr>th {
    padding: 10px;
  }

  .allocation_bill_div {
    overflow: auto;
    height: calc(100vh - 390px);
    margin-top: 10px;
  }

  .select-form-details thead {
    position: sticky;
    top: 0;
    z-index: 1;
    /* Ensure header stays above content */
  }

  /* .allocation-indication {
    border: 1.5px solid;
  } */

  .allocation-indication>td {
    font-weight: 600 !important;
  }
</style>

<body>
  <div class="loader">
    <div class="loader-wheel"></div>
    <div class="loader-text"></div>
  </div>

  <div class="show_page" style="display: none;">
    <div id="header"></div>
    <div class="wrapper_outer">
      <div class="container-fluid">
        <div class="detail_box">
          <div class="employee_form" id="emp_form">
            <div class="detail_top_bar">

            </div>
            <div class="col-sm-12 main_div">
              <div class="col-sm-12 bg_box">
                <div>

                  <img src="images\profile_image.png" alt="Factspan Logo" class="responsive" id="emp_profile_img"
                    width="100px" height="115px">

                  <button class="btn btn-info pull-right" id="employee" style="margin: 10px;">Back</button>

                  <div class="emp_div div_padding"><span id="emp_name"></span></div>
                  <div class="div_padding"><span id="emp_mail"></span></div>
                  <div class="div_padding"><span id="emp_desg"></span></div>
                  <div class="div_padding"><span id="emp_active">Active</span> <span id="emp_loc"></span></div>
                </div>
              </div>
            </div>
            <br>
            <div class="col-sm-12 main_div ">
              <div class="col-sm-12 bg_box">
                <div class="emp_radio_filter option_selections" style="width: 300px;">
                  <input type="radio" name="emp_radio" id="ALL" class="emp_select" value="ALL" onclick="getExpYtdData()"
                    checked>
                  <label for="ALL" style="width: 160px;">Allocation History</label>
                  <input type="radio" name="emp_radio" id="IND" class="emp_select" value="YTD"
                    onclick="getExpYtdData()">
                  <label for="IND" style="width: 120px;">YTD Billing %</label>
                </div>
                <div class="resource_ytd_history">
                  <!-- <table class="table table-bordered border-primary" id="emp_factspan_prjt_details"> -->
                  <div class="allocation_bill_div">
                    <table class="select-form-details table-bordered table-head" style="width: 100%;"
                      id="emp_factspan_prjt_details">
                      <thead>
                        <th>Account</th>
                        <th>SOW Name</th>
                        <th>Billing Status</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Tenure</th>
                        </th>
                      </thead>
                      <tbody>
                      </tbody>
                    </table>
                  </div>

                  <div id="ytd_billing_data">
                    <div class="ytd_div_new">
                      <span id="ytd_per_data">Overall -
                        <span id="ytd_mnth_data">90%</span>
                      </span>
                    </div>
                    <br>
                    <div class="ytd_month_data col-sm-12 bg_box ytd_block">
                    </div>
                  </div>
                </div>
              </div>

            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    $(document).ready(function () {
      assignMetaValue();
      $("meta[name='google-signin-client_id']").attr("content", metaValue);

      getLocalSessionData();
      if (sessionName == null) {
        window.location.href = 'index.html';
        return false;
      } else {

        $("#emp_name").html(empName);

        $("#emp_mail").html(sessionName);
        assignSowYTDData()
        $(".loader").css("display", "none");
        $(".show_page").css("display", "block");
      }
    });
    $('#dashboard').click(function () {
      window.location.href = 'home.html';
      return false;
    });
    $('#logout').click(function () {
      localStorage.clear();

      window.location.href = 'index.html';
      return false;
    });
    $('#employee').click(function () {
      window.location.href = 'team-profile.html';
      return false;
    });


    function convert(str) {
      var date = new Date(str),
        mnth = ("0" + (date.getMonth() + 1)).slice(-2),
        day = ("0" + date.getDate()).slice(-2);
      return [mnth, day, date.getFullYear().toString().substr(2, 2)].join("-");
    }


  </script>


</body>

</html>
