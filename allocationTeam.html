  .allocation_radio_filter {
    display: flex;
    justify-content: space-around;
    align-items: center;
    background-color: #cecece;
    width: 200px;
    height: 30px;
    border-radius: 9999px;
    margin-top: 8px;
    box-shadow: inset 0.5px 0.5px 2px 0 rgb(0 0 0 / 15%);
  }

  .allocation_radio_filter>input[type="radio"] {
    appearance: none;
    display: none;
  }

  .allocation_radio_filter>label,
  .sowteam_radio_filter>label {
    font-family: "Open Sans", sans-serif;
    font-size: 10px;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: inherit;
    width: 500px;
    height: 20px;
    text-align: center;
    border-radius: 9999px;
    overflow: hidden;
    transition: linear 0.3s;
    color: #6e6e6edd;
    margin-bottom: 0px;
    padding-left: 0px;
    margin: 5px;
  }

  .allocation_radio_filter>input[type="radio"]:checked+label {
    background-color: #1e90ff;
    color: #f1f3f5;
    font-weight: 900;
    transition: 0.3s;
  }

  .sowteam_radio_filter {
    display: flex;
    float: right;
    justify-content: space-around;
    align-items: center;
    background-color: #cecece;
    width: 160px;
    height: 25px;
    border-radius: 9999px;

    box-shadow: inset 0.5px 0.5px 2px 0 rgb(0 0 0 / 15%);

  }

  .sowteam_radio_filter>input[type="radio"] {
    appearance: none;
    display: none;
  }

  .sowteam_radio_filter>input[type="radio"]:checked+label {
    background-color: #1e90ff;
    color: #f1f3f5;
    font-weight: 900;

  }

<body>
  <div class="loader">
    <div class="loader-wheel"></div>
    <div class="loader-text"></div>
  </div>
  <div class="show_page" style="display: none;">
    <div id="header"></div>
  </div>
  <div class="wrapper_outer">
    <div class="container-fluid">
      <div class="detail_boxs">
        <div class="detail_top_bars">
          <div class="sowteam_radio_filter">
            <input type="radio" name="bench_acc" id="ALLBI" class="bench_select" value="ALLBI">
            <label for="ALLBI">SOW</label>
            <input type="radio" name="bench_acc" id="BENCH" class="bench_select" value="BENCH" onclick="getBenCurrFut()"
              checked>
            <label for="BENCH">TEAM</label>
          </div>

          <div class="allocation_radio_filter">
            <input type="radio" name="res_acc" id="ALL" class="emp_select" value="Current" onclick="getBenCurrFut()"
              checked>
            <label for="ALL">Current Bench</label>
            <input type="radio" name="res_acc" id="IND" class="emp_select" value="Future" onclick="getBenCurrFut()">
            <label for="IND">Future Bench</label>

          </div>
          <div class="employee_detail_inside employee_sow_details table-responsive fixTableHead">

            <!-- <div class="bench_h1">Bench & Investment</div> -->
            <!-- <table class="table table-bordered border-primary sow_emp_details_class" id="bench_table"> -->
            <table calss="table table-bordered border-primary" id="emp_table" style="width: 100%;">

              <thead class="thead-light table_hd1" id="allocation_sow">

              </thead>
              <tbody id="report_overall_summary_body1" style="text-align:center;"></tbody>

            </table>

            <table calss="table table-bordered border-primary" id="emp_table_future" style="width: 100%;">

              <thead class="thead-light table_hd1" id="allocation_sow_future">

              </thead>
              <tbody id="report_overall_summary_body1_future" style="text-align:center;"></tbody>

            </table>
          </div>

        </div>
      </div>
    </div>
  </div>
  <script>
    $(document).ready(function () {
      assignMetaValue();
      $("meta[name='google-signin-client_id']").attr("content", metaValue);

      getLocalSessionData();
      if (sessionName == null) {
        window.location.href = 'index.html';
        return false;
      } else {
        //getBenInvData();
        getBenCurrFut();
        $(".loader").css("display", "none");
        $(".show_page").css("display", "block");

      }

    });
    $('#ALLBI').click(function () {
      window.location.href = 'allocationDashboard.html';
      return false;
    });


    $('#logout').click(function () {
      localStorage.clear();
      window.location.href = 'index.html';
      return false;
    });

  </script>
