  <script>
      
    $(document).ready(function () {
      $(".allReportDiv").hide()
      $(".report_module").hide()
      assignMetaValue();
      $("meta[name='google-signin-client_id']").attr("content", metaValue);
      getLocalSessionData();
      if (sessionName == null) {
        window.location.href = 'index.html';
        return false;
      } else {
        let accessStatus = checkDashboardPageAccessData()
        if (accessStatus) {
          let accessLevel = checkEachPageAccess("Reports")
          if (accessLevel.length > 0) {
            let environment = accessLevel[0]
            if (environment == apiValue.environment) {
              let access_page_list = $.parseJSON(localStorage.getItem("access-page-list"))
              console.log("accessStatus - ",accessStatus)
              console.log("accessLevel - ",accessLevel)
              console.log("access_page_list - ",access_page_list)
              let userRole = localStorage.getItem("user-role")
              let userEmail = localStorage.getItem("email")
              let userDept = localStorage.getItem("Department")
              let userJobRole = localStorage.getItem("Job_Role")
              
              $.each(access_page_list, function (h, page) {
                if (page == "All") {
                  $(".allReportDiv").show()
                  $(".report_module").show()
                } else {
                  $("#" + page.replace(".html", "")).show()
                  $("." + page.replace(".html", "") + "_div").show()
                }
              })
              $(".reporting_main_div").hide()
              framework_report_list()
              $(".show_page").css("display", "block");
              $(".loader").css("display", "none");
              $(".show_page").css("display", "block");
              $(".new-sub-menu").hover(function () {
                $('.sub-menu').css('display', '')
              });
              if(userEmail == "akhilesh@factspan.com" || userRole == "admin" ||
                userDept == 'CEO' || userDept == 'Finance' || userDept == 'CEO Office' || userDept == 'Products' || userJobRole == 'Vice President'
              ){
                $('#weekly_usage_div').show()
                $('#report_us_bench_list_div').show()
                $('#resource_utilization_div').show()
                $('#audit_div').show() 
              }else{
                $('#weekly_usage_div').hide()
                $('#report_us_bench_list_div').hide()
                $('#resource_utilization_div').hide()
                $('#audit_div').hide()
              }
              // if(userEmail == "nitin.pandey@factspan.com"){
              //   $('#report_us_bench_list_div').show()
              //   $('#resource_utilization_div').show()
              // }
              // if(userRole == "admin" || userDept == 'Products'){
              //   $('#audit_div').show() 
              // }else{
              //   $('#audit_div').hide()
              // }
            } else {
              window.location.href = "home.html"
            }
          } else {
            window.location.href = "home.html"
          }
        } else {
          window.location.href = "home.html"
        }
        // $('#create-report').click(function(){
        //   window.location.href = 'reporting-framework.html'
        //   return false;
        // })
      }
    });
