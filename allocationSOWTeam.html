  <script type="text/javascript">
    $(document).ready(function () {

      assignMetaValue();
      $("meta[name='google-signin-client_id']").attr("content", metaValue);
      
      getLocalSessionData();
      if (sessionName == null) {
        window.location.href = 'index.html';
        return false;
      } else {
        
        $(".resource_div").hide();
        $(".existing_resource").hide();
        $(".available_resource").hide();
        $(".no_existing_resources").hide();
        $(".no_ava_resources").hide();
        getFindResourceData();
        $(".extra_br").show();
        $(".loader").css("display", "none");
        $(".resource_div").show();
        $(".show_page").css("display", "block");
        $(".invoiceClass").hide();
        $('.input-group-addon').hide();
        
      }

      $(window).resize(resize);
      resize();
      $(".new-sub-menu").hover(function () {
        $('.sub-menu').css('display', '')
        
      });

    });
    function resize() {
      if ($(window).width() < 514) {
        $('#resp-table').addClass('table-responsive');
      }
      else {
        $('#resp-table').removeClass('table-responsive');
      }
    }
    let skillOptions = "";
    function getSkillOptions() {

      $.ajax({
        
        url: apiValue.url,
        type: "POST",
        dataType: "json",
        crossDomain: true,
        format: "json",
        async: false,
        mode: 'no-cors',
        data: {
          query_type: "select",
          "db_name": apiValue.db_name,
          "environment": apiValue.environment,
          "table_name": "SKILL_CONFIG",
          "columns": "",
          "filter": ""
        },
        success: function (data) {
          skillOptions = '<option value="">Select Any Skill</option>';
          $.each(data.Details, function (value, option) {
            skillOptions += '<option value="' + option.SKILL_ID + '">' + option.SKILL_NAME + '</option>';
          });
        },
        error: function (error) {
          console.log('message Error' + JSON.stringify(error));
        }

      });

    }

    $('#legal_start_date').datepicker({
      format: 'mm-dd-yy',
      uiLibrary: 'bootstrap'

    $('#legal_end_date').datepicker({
