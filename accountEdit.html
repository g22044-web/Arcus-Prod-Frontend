    <div id="header"></div>
    <div id="account-creation-page">
      <div class="account-edit-toolbar">
        <div class="account-edit-toolbar-left">
          <div class="account-edit-title acc-font-style">Account Details</div>
          <div id="tab-buttons-account" class="tab-buttons-account"></div>
        </div>
        <div class="account-edit-toolbar-right">
          <div class="col-sm-2 cstm-text-align-end">
            <button
              class="btn save-btn sow_btn_cus_style acc-font-style"
              type="button"
              id="updateAccountData"
              onclick="updateAccountData()"
            >
              <i class="fa-regular fa-floppy-disk fa-lg"></i>Update
            </button>
            <button
              class="btn cancel-btn sow_btn_cus_style acc-font-style"
              type="button"
              id="cancelAccount"
              onclick="cancelAccount()"
            >
              <i class="fa-regular fa-circle-xmark"></i> Cancel
            </button>
          </div>
        </div>
      </div>
      <div class="container main-content">
        <!-- Tab content container -->
        <div class="row">
          <div id="tab-content-container-account"></div>
        </div>
      </div>
      <div class="account_sec_block">
        <div class="each_acc_block">
          <div class="acc-label-block">
            <label for="aad_account_name">
              Account Name <span class="warningMessage">*</span>
            </label>
          </div>
          <div class="account_fields" id="account_name_view">Test Account</div>
        </div>
        <div class="each_acc_block">
          <label for="add_location">
            Location <span class="warningMessage">*</span></label
          >
          <div class="account_fields acc_view" id="account_location_view">
            India
          </div>
          <select id="add_location" class="acc_edit">
            <option value="-1">Select Location</option>
            <option value="India">India</option>
            <option value="US">US</option>
          </select>
        </div>
        <div class="each_acc_block">
          <div class="buying_label_data">
            <div>Buying Center <span class="warningMessage">*</span></div>
            <div style="display: none;">
              <button type="button" class="btn buying_center_btn" id="view_edit_buying_center" style="padding: 3px 6px; font-size: 11px;" onclick="newBuyingCenter()">+ New</button>
            </div>
          </div>
          <div style="display: flex; align-items: center;">
            <div class="account_fields acc_view" id="buying_center_view">
              Buying Center
            </div>
            <select id="add_buying_center" class="acc_edit" onchange="changeBuyingCenter(this)" style="margin-right: 5px;">
            </select>
            <button type="button" class="btn buying_center_btn" id="view_edit_buying_center" onclick="viewEditBuyingCenter()">View/Edit</button>
          </div>
        </div>
        <div class="each_acc_block">
          <label for="stakeHolder"
            >NPS Stake Holder <span class="warningMessage">*</span></label
          >
          <div class="account_fields acc_view" id="nps_stakeholder_view">

      $(document).ready(function () {
        assignMetaValue();
        $("meta[name='google-signin-client_id']").attr("content", metaValue);
        getLocalSessionData();
        if (sessionName == null) {
          window.location.href = "index.html";
          return false;
        } else {
          $("body").css("display", "block");
          getSowViewData();
          AccountDataView();
          // createAccount();
          $("#add_contact_factspan").select2({});
          $("#add_contact_account").select2({});
          $("#add_business_head").select2({});
          $("#add_delivery_head").select2({});
          $("#add_location").select2({});
          $("#account_size").select2({});
          $("#payment_term").select2({});
          $("#add_buying_center").select2({});
          $("#add_nps_holder").select2({});

          $(".input-group-addon").hide();
          $("#accWarningMsg").hide();
          $("#closePopup").click(function () {
            $("#popup").fadeOut(200);
            $("#popup_nps").fadeOut(200);
            $("#overlay").removeClass("overlay");
          });
          $("#closeNPSPopup").click(function () {
            $("#popup_nps").fadeOut(200);
            $("#overlay").removeClass("overlay");
          });
        }

        $(window).resize(resize);
        resize();
        $(".new-sub-menu").hover(function () {
          $(".sub-menu").css("display", "");
        });
      });
      function resize() {
        if ($(window).width() < 514) {
          $("#resp-table").addClass("table-responsive");
        } else {
          $("#resp-table").removeClass("table-responsive");
        }
      }
      let skillOptions = "";

      $("#ms_signed_date").datepicker({
        format: "mm-dd-yy",
        uiLibrary: "bootstrap",
      });

      $("#dashboard").click(function () {
        window.location.href = "home.html";
        return false;
      });
      $("#sow_creation_page").click(function () {
        window.location.href = "sowCreate.html";
        return false;
      });
      $("#logout").click(function () {
        localStorage.clear();
        window.location.href = "index.html";
        return false;
      });
    </script>
