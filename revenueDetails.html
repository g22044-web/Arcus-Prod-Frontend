  <script>
    $(document).ready(function () {
      assignMetaValue();
      $("meta[name='google-signin-client_id']").attr("content", metaValue);
     
      getLocalSessionData();
      if (sessionName == null) {
        window.location.href = 'index.html';
        return false;
      } else {
        // Access checking for Revenue page
        let accessStatus = checkDashboardPageAccessData()
        $("#account_details").css("visibility", "hidden")
        let getUserRole = localStorage.getItem("user-role");
        let useremail = localStorage.getItem("email");
        let userDepartment = localStorage.getItem("Department");
        let userDesignation = localStorage.getItem("Job_Role");
        let access_page_list = $.parseJSON(localStorage.getItem("access-page-list"))
        // $.each(access_page_list, function(h, page){
        //   switch(page){
        //     case "accountDetails.html":
        //       $("#account_details").css("visibility", "visible")
        //     case "All":
        //       $("#account_details").css("visibility", "visible")
        //   }
        // })
        if(userDesignation == "Vice President") {
          $("#account_details").css("visibility", "visible")
        }
        if (getUserRole.toLocaleLowerCase() == "admin" || useremail.toLocaleLowerCase() == "akhilesh@factspan.com") {
          $("#account_details").css("visibility", "visible")
        }
        if(accessStatus){
          let accessLevel = checkEachPageAccess("Revenue")
          if(accessLevel.length > 0){
            let environment = accessLevel[0]
            if(environment == apiValue.environment){
              $('body').bind('copy paste', function (e) {
              e.preventDefault(); return false;
              });
              $(".table-loading").show();
              getSowViewData();              
              $('.green').attr('background-color', '#b1eeb1 !important');
                        
              $('.input-group-addon').hide();
              $(".loader").css("display", "none");
              $(".show_page").css("display", "block");
              
              let backBtnSowName = localStorage.getItem("BackSowAccName");
              localStorage.setItem('sowBackBtnNav', '')
              // gotoSOWName(backBtnSowName);

              let pageLevelAccess = accessLevel[1]
                let eachLevel = pageLevelAccess.split(',') 
                $.each(eachLevel, function(l, level){
                  switch(level){
                    case "view": 
                      $("#sow_Res_page").hide()
                      break;
                    case "edit": 
                      $("#sow_Res_page").show()
                      break;
                  }
                })

            }else{
              window.location.href = "home.html"
            }
          }
          
        }else{
            window.location.href = "home.html"
        }       
      }
      $(".new-sub-menu").hover(function () {
        $('.sub-menu').css('display', '')
        
      });
      $('#dashboard').click(function () {
        window.location.href = 'home.html';
        return false;
      });
      $('#userManual').click(function () {
        
        window.location.href = 'RRESOWUserManual.html';
        return false;
      });
      $('#logout').click(function () {
        localStorage.clear();
       
        window.location.href = 'index.html';
        return false;
      });
      // $('#account_details').click(function () {
      //   window.location.href = 'accountDetails.html';
      //   return false;
      // })
    });
